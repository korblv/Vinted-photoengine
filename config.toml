# Workflow v2 konfigurācija (produkcijas refaktors, solis 4, PROGRESS §59).
#
# Šeit dzīvo PARAMETRI — vērtības, ko drīkst mainīt kalibrēšana/palaišana.
# SPECIFIKĀCIJA apzināti paliek kodā un testu sardzē: audekls 2000x2500,
# fons #F3F3F3 (243), visi checker pieņemšanas vārti (00 dokuments, §5).
# Vārtu slieksni nedrīkst atvieglot, rediģējot šo failu.
#
# Prioritāte: CLI arguments > šis fails. Nezināma atslēga vai nepareizs
# tips = kļūda pie ielādes (nekādu klusu noklusējumu).
config_version = 1

[run]
closeup_proc_w = 768
png_level = 1
framing = "auto"          # auto | slamjam | original
wb_mode = "auto"          # auto | identity
auto_closeup = true
auto_grabcut_iters = 5

[mask]
silhouette_fill_min = 0.60
pad_retry = 0.90
pad_overflow_limit = 0.02   # maskas daļa, kas ir acīmredzams papīrs
pad_uncovered_limit = 0.05  # audums, kas palicis ārpus maskas
pad_tex_relaxed = 2.5       # graudains kartons ~1.6; gluds fotopapīrs ~0.6
ai_qa_coverage_min = 0.15
ai_qa_coverage_max = 0.65
ai_qa_largest_min = 0.95
ai_qa_bbox_area_min = 0.35
ai_qa_bbox_w_min = 0.45
ai_qa_bbox_h_min = 0.35
# Iekšējo caurumu klasificēšana pēc satura (PROGRESS §97): audums ->
# aizpilda, fons tuvu malai -> atver ar šauru kanālu, pārējais -> atstāj.
hole_min_px = 400          # mazākos GATE_C nesoda; tos neaiztiekam
hole_margin_de = 3.0       # Lab attāluma rezerve; bez tās "neskaidrs" -> atstāj
hole_tex_ratio = 1.8       # fona caurums nedrīkst būt daudz teksturētāks par fonu
hole_tex_abs = 1.0
hole_border_px = 96        # fona caurumu atver tikai tuvu kadra malai
hole_max_cut_px = 250      # maks. FG pikseļu skaits, ko drīkst izgriezt kanālam
hole_max_fill_frac = 0.02  # lielāku auduma caurumu nelabo (eskalācija)

[plate]
inner_min = 0.50      # iekšmalas tekstūra pret iekšpusi; zema = iekšā ir fons
outer_max = 0.60      # ārējās malas tekstūra pret iekšpusi; augsta = ārā ir audums
bg_inside_max = 0.02  # fona-pikseļu daļa maskas iekšpusē
cover_min = 0.25
cover_max = 0.95

[chroma]
# Krāsu-attāluma REZERVES ceļš (engine/chroma.py, PROGRESS §76). Darbojas
# tikai, kad papīra ķēde masku nav devusi vai kandidāts ir strukturāli
# slikts; pats sevi noraida, ja krāsas nav pārliecinoši atdalāmas.
scale = 2                    # darba mērogs (1/scale), kā plāksnes ceļā
palette_k = 8                # mediān-griezuma paletes centri katrai klasei
fg_alpha = 0.90              # priekšplāna sēkla: ISNet alfa vismaz tik
fg_core_alpha = 0.80         # kodola attālumu mēra no šīs robežas
fg_core_dist_px = 10.0       # sēklas dziļums kodolā (pusmēroga px)
border_alpha_max = 0.50      # malas gredzens: alfa ne vairāk par tik
seed_margin_dE = 18.0        # fona sēkla: vismaz tik tālu no FG paletes
bg_refine_dE = 25.0          # globāla fona sēkla: tik tuvu malas paletei
margin_sigma = 2.0           # klasifikācijas lauka izlīdzināšana (px)
min_cross_dE = 15.0          # palešu min. savstarpējais attālums (QA)
seed_margin_ratio_min = 2.0  # sēklai otra palete vismaz 2x tālāk (QA)
max_ambiguous_fraction = 0.08  # |dB-dF| < 5 pikseļu daļa (QA)
# Otrais piegājiens: tumšās zonas (ēnas līču) izšķīrējs (PROGRESS §78).
dark_L = 25.0                # L* zem šīs = tumšā zona
dark_palette_k = 4           # tumšo palešu centri
dark_min_cross_dE = 8.0      # centru savstarpējā attīrīšana (sakrīt = ārā)
dark_uncertain_field = 5.0   # tumšais lauks zem šī = nav pārliecinoši apģērbs
dark_tex_ratio = 1.5         # tekstūra < tik * tumšā fona sēklu mediāna
dark_seed_min_frac = 0.0005  # min. tumšo sēklu daļa no kadra katrai klasei
dark_carve_max_frac = 0.05   # izgrebuma griesti pret masku (drošinātājs)

[decontam]
max_px = 30
tex_ratio = 0.45

[grade]
curve_blend = 0.18
highlight_knee = 0.86
exposure_target = 248.0
exposure_min = 0.99
exposure_max = 1.06
exposure_step = 0.01
exposure_max_adjustments = 6
wb_chroma_max = 0.18
wb_shrink = 0.62
gain_clip_min = 0.88
gain_clip_max = 1.14
clipping_limit_pct = 1.5
sharpen_radius = 1.4
sharpen_percent = 25
sharpen_threshold = 3
