name: Tests (pytest)

on:
  push:
    branches: [main]
    paths-ignore:
      - "arena-vinted-dzinejs.zip"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.3.5 \
            scipy==1.17.1 \
            Pillow==12.3.0 \
            opencv-python-headless \
            pytest

      - name: Run 142+ unit, regression & independence tests
        run: python -m pytest test_workflow_v2.py -q
